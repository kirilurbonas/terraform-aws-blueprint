# Trivy misconfiguration suppressions.
#
# Every entry needs a written justification. A finding that is a real gap gets
# a roadmap item and an `expired_at`, not a permanent suppression — when the
# date passes, Trivy reports it again and the build goes red.
#
# Each check is listed twice, under both ID forms. The downloadable checks
# bundle (what CI uses) reports `AVD-AWS-0104`; the check set embedded in the
# trivy binary — which is what you get from the `--skip-check-update` offline
# fallback — reports the same check as `AWS-0104`. Listing one form only means
# the suppressions silently stop matching depending on how Trivy was invoked.

misconfigurations:
  # --- Unrestricted egress on the EKS security groups: deliberate ------------
  - id: AVD-AWS-0104
    paths:
      - "modules/eks/main.tf"
    statement: &egress >-
      Unrestricted egress on the EKS cluster and node security groups is
      deliberate. Nodes must reach the EKS control-plane endpoint, ECR, S3, STS
      and CloudWatch to join the cluster and pull images at all; the control
      plane must reach the nodes. Constraining this correctly means VPC
      endpoints plus a per-account prefix-list policy, which is a consumer
      decision, not something a general-purpose module can encode. The module
      does ship the VPC endpoints that reduce how much of this traffic leaves
      the VPC — see `interface_endpoints` in the vpc module.
  - id: AWS-0104
    paths:
      - "modules/eks/main.tf"
    statement: *egress

  # --- Public subnets assigning public IPs: deliberate -----------------------
  - id: AVD-AWS-0164
    paths:
      - "modules/vpc/main.tf"
    statement: &publicip >-
      `map_public_ip_on_launch = true` on the public subnets is what makes them
      public subnets. Workloads are placed in the private subnets; the public
      tier exists for NAT gateways and internet-facing load balancers, both of
      which require it.
  - id: AWS-0164
    paths:
      - "modules/vpc/main.tf"
    statement: *publicip

  # --- Internet-facing ALB: deliberate default --------------------------------
  - id: AVD-AWS-0053
    paths:
      - "modules/alb/main.tf"
    statement: &publicalb >-
      The alb module defaults to internet-facing because it is the public
      ingress path for EKS and ECS workloads. Exposure is limited to 443 with
      a TLS 1.3 security policy enforced by validation, plus an optional
      listener on 80 that can only issue a 301 to HTTPS; invalid headers are
      dropped and desync mitigation is strictest. Private load balancers set
      `internal = true`.
  - id: AWS-0053
    paths:
      - "modules/alb/main.tf"
    statement: *publicalb
