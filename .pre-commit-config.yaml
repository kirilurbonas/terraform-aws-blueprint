---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
          # Write the same <!-- BEGIN_TF_DOCS --> markers that
          # .terraform-docs.yml declares, so the hook and `make docs` inject
          # into the same block instead of each maintaining its own.
          - --hook-config=--use-standard-markers=true
      - id: terraform_tflint
        args:
          # Rules live in the shared .tflint.hcl at the repo root so that
          # pre-commit and CI enforce exactly the same set. Passing --only
          # here would silently narrow it back down.
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--minimum-failure-severity=warning
      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL
