---
formatter: markdown table
recursive:
  enabled: false

sections:
  hide:
    - header
    - footer

content: |-
  {{ .Requirements }}

  {{ .Providers }}

  {{ .Modules }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: true
  html: true
  indent: 2
  # false on purpose: with lockfile resolution on, the Providers table renders
  # whatever version happens to be installed locally, so the generated docs
  # differ between a developer's machine and a CI checkout that never ran
  # `terraform init` — and every upstream provider release dirties 11
  # READMEs. Off, the table shows the declared constraint, which is the thing
  # consumers actually need to know.
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
