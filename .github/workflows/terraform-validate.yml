---
name: Terraform Validate

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tftest.hcl'
      - '**/.terraform.lock.hcl'
      - '.tflint.hcl'
      - '.terraform-docs.yml'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/workflows/terraform-validate.yml'
      - 'policy/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tftest.hcl'
      - '**/.terraform.lock.hcl'
      - '.tflint.hcl'
      - '.terraform-docs.yml'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/workflows/terraform-validate.yml'
      - 'policy/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # The floor of the `aws` provider constraint every module declares. The
  # floor-validate job pins to it so a module that quietly starts depending on
  # a newer provider feature fails here instead of in a consumer's stack.
  AWS_PROVIDER_FLOOR: "6.0.0"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fmt.outcome }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - id: fmt
        run: terraform fmt -check -recursive -diff

  discover:
    name: discover terraform dirs
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
      examples: ${{ steps.find.outputs.examples }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          set -euo pipefail
          modules=$(find modules -mindepth 1 -maxdepth 1 -type d | jq -R -s -c 'split("\n")[:-1]')
          examples=$(find examples -mindepth 1 -maxdepth 1 -type d | jq -R -s -c 'split("\n")[:-1]')
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"
          echo "examples=${examples}" >> "$GITHUB_OUTPUT"

  validate-modules:
    name: validate ${{ matrix.dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false
      - working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  validate-modules-provider-floor:
    name: validate ${{ matrix.dir }} @ provider floor
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: pin the aws provider to the declared floor
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          cat > zz_provider_floor_override.tf <<EOF
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "${AWS_PROVIDER_FLOOR}"
              }
            }
          }
          EOF
      - working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false
      - working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  validate-examples:
    name: validate ${{ matrix.dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.examples) }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      # Examples are root modules and ship a committed lock file, so init must
      # honour it rather than silently resolving something else.
      - working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -lockfile=readonly
      - working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  test-modules:
    name: terraform test ${{ matrix.dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: skip if no tests
        id: check
        working-directory: ${{ matrix.dir }}
        run: |
          if compgen -G "tests/*.tftest.hcl" > /dev/null; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.has_tests == 'true'
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false
      - if: steps.check.outputs.has_tests == 'true'
        working-directory: ${{ matrix.dir }}
        run: terraform test -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      # `make lint` is the same entry point developers run locally, so the
      # rule set and invocation cannot drift between here and a workstation.
      - run: make lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      # Two passes on purpose. The first reports every severity to the
      # Security tab without gating; the second gates the build on
      # HIGH/CRITICAL only. Collapsing them would either hide MEDIUM findings
      # from code scanning or turn them into build failures.
      - name: Trivy misconfiguration scan (report all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: '**/.terraform'
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-config
      - name: Trivy misconfiguration scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: '**/.terraform'
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'

  docs:
    name: terraform-docs drift
    runs-on: ubuntu-latest
    env:
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v6
      - name: install terraform-docs
        run: |
          set -euo pipefail
          curl -sSL "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin terraform-docs
          chmod +x /usr/local/bin/terraform-docs
      # Same target developers run, driven by the same .terraform-docs.yml, so
      # a passing local `make docs-check` guarantees a passing job.
      - run: make docs-check

  pre-commit:
    name: pre-commit (non-terraform hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # The terraform hooks have dedicated jobs above; this catches drift in
      # the repo-hygiene hooks (yaml, EOF, line endings, private keys).
      - run: pipx run pre-commit run --all-files --config .pre-commit-config.yaml
        env:
          SKIP: terraform_fmt,terraform_validate,terraform_docs,terraform_tflint,terraform_trivy

  policy:
    name: policy (conftest on example plans)
    runs-on: ubuntu-latest
    env:
      CONFTEST_VERSION: "0.70.1"
      MOTO_VERSION: "5.2.4"
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: install conftest
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest
      # Moto stands in for the AWS API during plan: the provider still calls it
      # for credential checks and a few data sources. No AWS account is used.
      - name: install moto
        run: pipx install "moto[server]==${MOTO_VERSION}"
      # Same targets developers run: policy unit tests first, then every
      # example is planned and its plan JSON evaluated against policy/.
      - run: make policy

  comment:
    name: PR validation summary
    if: github.event_name == 'pull_request' && always()
    needs:
      - fmt
      - validate-modules
      - validate-modules-provider-floor
      - validate-examples
      - test-modules
      - tflint
      - trivy
      - docs
      - pre-commit
      - policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-validate
          message: |
            ### Terraform validation — `${{ github.sha }}`

            | Check | Result |
            | --- | --- |
            | terraform fmt | ${{ needs.fmt.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.fmt.result }} |
            | module validate | ${{ needs.validate-modules.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.validate-modules.result }} |
            | module validate @ provider floor | ${{ needs.validate-modules-provider-floor.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.validate-modules-provider-floor.result }} |
            | example validate | ${{ needs.validate-examples.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.validate-examples.result }} |
            | terraform test | ${{ needs.test-modules.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.test-modules.result }} |
            | tflint | ${{ needs.tflint.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.tflint.result }} |
            | trivy | ${{ needs.trivy.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.trivy.result }} |
            | terraform-docs drift | ${{ needs.docs.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.docs.result }} |
            | pre-commit | ${{ needs.pre-commit.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.pre-commit.result }} |
            | policy (conftest) | ${{ needs.policy.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.policy.result }} |

            _Workflow run: ${{ github.run_id }}_
